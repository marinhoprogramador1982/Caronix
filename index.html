<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>CARONIX</title>
<link rel="manifest" href="manifest.json">

<style>
:root {
  --bg:#f4f5f6;
  --card:#ffffff;
  --text:#171717;
  --muted:#777;
  --border:#e5e5e5;
  --green:#16a34a;
}
body.dark {
  --bg:#101010;
  --card:#202020;
  --text:#ffffff;
  --muted:#bbbbbb;
  --border:#383838;
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
header {
  background:var(--card);
  padding:25px 20px;
  border-bottom:1px solid var(--border);
}
.logo {
  font-size:28px;
  font-weight:900;
  letter-spacing:3px;
}
.logo span {color:var(--green)}
header p {font-size:11px;color:var(--muted)}
main {padding:20px;max-width:600px;margin:auto}
.card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:20px;
  margin-bottom:18px;
}
h2 {font-size:19px;margin-top:0}
label {display:block;font-size:13px;margin:14px 0 6px}
input,select {
  width:100%;
  padding:14px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
}
button {
  width:100%;
  padding:15px;
  border:0;
  border-radius:10px;
  background:var(--green);
  color:white;
  font-size:15px;
  font-weight:bold;
  margin-top:15px;
}
.secondary {
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--border);
}
small {color:var(--muted)}
nav {
  display:flex;
  justify-content:space-around;
  background:var(--card);
  border-top:1px solid var(--border);
  padding:12px 5px;
  position:sticky;
  bottom:0;
}
nav button {
  width:auto;
  margin:0;
  padding:9px;
  background:transparent;
  color:var(--text);
  font-size:12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">CARO<span>NIX</span></div>
  <p>COMPARTILHE A VIAGEM. CHEGUE MAIS LONGE.</p>
</header>

<main>

<section class="card">
  <h2>Encontre sua carona</h2>

  <label>Origem</label>
  <input id="origem" value="Recife - PE">

  <label>Destino</label>
  <input id="destino" value="João Pessoa - PB">

  <label>Data da viagem</label>
  <input id="data" type="date">

  <label>Passageiros</label>
  <select id="passageiros">
    <option>1 passageiro</option>
    <option>2 passageiros</option>
    <option>3 passageiros</option>
    <option>4 passageiros</option>
  </select>

  <button onclick="procurar()">PROCURAR CARONA</button>
  <button class="secondary" onclick="oferecer()">OFERECER CARONA</button>
</section>

<section class="card">
  <h2>Minha conta</h2>
  <label>Nome</label>
  <input id="nome" placeholder="Digite seu nome">
  <button onclick="salvarNome()">SALVAR NOME</button>
</section>

<section class="card">
  <h2>Aparência do aplicativo</h2>
  <small>Escolha seu modo de visualização.</small>

  <label>Modo de tela</label>
  <select id="tema" onchange="mudarTema()">
    <option value="claro">☀️ Claro</option>
    <option value="escuro">🌙 Escuro</option>
    <option value="automatico">📱 Automático</option>
  </select>
</section>

</main>

<nav>
  <button onclick="topo()">⌂ Início</button>
  <button onclick="oferecer()">＋ Oferecer</button>
  <button onclick="viagens()">▣ Viagens</button>
  <button onclick="perfil()">◉ Perfil</button>
</nav>

<script>
function aplicarTema(tema) {
  const escuro = tema === "escuro" ||
    (tema === "automatico" &&
    window.matchMedia("(prefers-color-scheme: dark)").matches);

  document.body.classList.toggle("dark", escuro);

  document.querySelector('meta[name="theme-color"]')
    .setAttribute("content", escuro ? "#101010" : "#ffffff");
}

function mudarTema() {
  const tema = document.getElementById("tema").value;
  localStorage.setItem("caronix-tema", tema);
  aplicarTema(tema);
}

const temaSalvo = localStorage.getItem("caronix-tema") || "claro";
document.getElementById("tema").value = temaSalvo;
aplicarTema(temaSalvo);

window.matchMedia("(prefers-color-scheme: dark)")
.addEventListener("change", function() {
  if (document.getElementById("tema").value === "automatico") {
    aplicarTema("automatico");
  }
});

function procurar() {
  alert("A busca de caronas será conectada ao sistema na próxima etapa.");
}

function oferecer() {
  alert("Área de oferta de caronas em desenvolvimento.");
}

function salvarNome() {
  localStorage.setItem("caronix-nome",
    document.getElementById("nome").value);
  alert("Nome salvo neste aparelho!");
}

function topo() {
  window.scrollTo({top:0,behavior:"smooth"});
}

function viagens() {
  alert("Área de viagens em desenvolvimento.");
}

function perfil() {
  document.querySelectorAll(".card")[1]
    .scrollIntoView({behavior:"smooth"});
}

document.getElementById("nome").value =
  localStorage.getItem("caronix-nome") || "";
</script>

</body>
</html>
